      justify-content: center;
      color: #8A8A8A;

      gap: 14px;

      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px;
      color: var(--ink);
      font-size: 15px;
      font-weight: 600;
      transition: border-color .12s ease, background .12s ease;
    }
    .link:hover { border-color: var(--accent); background: #EAF3FB; text-decoration: none; }
    .link .icon { display: flex; color: var(--accent); flex-shrink: 0; }
    .link .label { flex-grow: 1; }
    .link .chevron { color: #9A9A9A; flex-shrink: 0; }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: var(--muted);
    }
    .back:hover { color: var(--ink); text-decoration: none; }
