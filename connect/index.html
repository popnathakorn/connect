<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Connect &middot; Firstname Lastname</title>
  <meta name="description" content="Ways to connect with Firstname Lastname.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #F4F2EE;
      --card: #FFFFFF;
      --ink: #1D2226;
      --muted: #5E5E5E;
      --line: #E0DFDC;
      --accent: #0A66C2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Source Sans 3", -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }
    p { margin: 0; }
    a { color: var(--accent); text-decoration: none; }

    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 64px 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .header { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: #E9E5DF;
      border: 3px solid var(--card);
      box-shadow: 0 0 0 1px var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8A8A8A;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    h1 { margin: 0; font-size: 22px; font-weight: 700; }
    .tagline { font-size: 15px; color: var(--muted); text-align: center; }

    .links { width: 100%; display: flex; flex-direction: column; gap: 12px; }
    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px;
      color: var(--ink);
      font-size: 15px;
      font-weight: 600;
      transition: border-color .12s ease, background .12s ease;
    }
    .link:hover { border-color: var(--accent); background: #EAF3FB; text-decoration: none; }
    .link .icon { display: flex; color: var(--accent); flex-shrink: 0; }
    .link .label { flex-grow: 1; }
    .link .chevron { color: #9A9A9A; flex-shrink: 0; }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: var(--muted);
    }
    .back:hover { color: var(--ink); text-decoration: none; }

    @media (max-width: 480px) {
      .page { padding-top: 40px; }
    }
  </style>
</head>
