<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- TODO: replace name + description with your own -->
  <title>Firstname Lastname</title>
  <meta name="description" content="Short tagline about what you do.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #F4F2EE;
      --card: #FFFFFF;
      --ink: #1D2226;
      --muted: #5E5E5E;
      --line: #E0DFDC;
      --accent: #0A66C2;
      --accent-hover: #004182;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Source Sans 3", -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }
    p { margin: 0; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); text-decoration: underline; }

    .page {
      max-width: 560px;
      margin: 0 auto;
      padding: 56px 20px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .profile { overflow: hidden; }
    .cover {
      height: 120px;
      background: linear-gradient(135deg, #C6D5E3 0%, #A9C3D9 100%);
    }
    .profile-body {
      padding: 0 28px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      background: #E9E5DF;
      border: 4px solid var(--card);
      margin-top: -56px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8A8A8A;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .identity { display: flex; flex-direction: column; gap: 4px; }
    h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
    .tagline { font-size: 16px; }
    .location { font-size: 14px; color: var(--muted); }

    .cta {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 999px;
    }
    .cta:hover { background: var(--accent-hover); color: #FFFFFF; text-decoration: none; }

    .about {
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    h2 { margin: 0; font-size: 18px; font-weight: 700; }
    .about p { font-size: 15px; line-height: 1.6; color: #3A3A3A; }

    .footer {
      text-align: center;
      font-size: 13px;
      color: #8A8A8A;
      margin-top: 8px;
    }

    @media (max-width: 480px) {
      .page { padding-top: 32px; }
      .profile-body, .about { padding-left: 20px; padding-right: 20px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card profile">
      <div class="cover"></div>
      <div class="profile-body">
        <div class="avatar">
          <!-- Swap for a headshot: <img src="avatar.jpg" alt="Firstname Lastname"> -->
          <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"></path></svg>
        </div>
        <div class="identity">
          <h1>Firstname Lastname</h1>
          <p class="tagline">Short tagline &mdash; your role, focus, or a line that sums you up</p>
          <p class="location">City, Country</p>
        </div>
        <a class="cta" href="/connect">
          Connect
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
        </a>
      </div>
    </section>

    <section class="card about">
      <h2>About</h2>
      <p>[Write 2&ndash;3 sentences introducing yourself here &mdash; who you are, what you care about, and what you&rsquo;re working on right now. Keep it casual and human.]</p>
    </section>

    <p class="footer">nathakorn.cv</p>
  </main>
</body>
</html>
